name: release

# A version tag builds hypertop for each platform and publishes the builds, with the
# bundled sources next to the binary, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -qy musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Upload the build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="hypertop-$GITHUB_REF_NAME-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/hypertop" LICENSE README.md "$dir/"
          cp -R sources "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          gh release upload "$GITHUB_REF_NAME" "$dir.tar.gz"
