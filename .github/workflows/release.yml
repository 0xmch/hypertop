name: release

# A version tag builds hypertop for each platform, and only when every build and its
# tests pass, publishes them with the bundled sources next to the binary as a release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -qy musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Pack the build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dir="hypertop-$GITHUB_REF_NAME-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/hypertop" LICENSE README.md "$dir/"
          cp -R sources "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hypertop-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes hypertop-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
