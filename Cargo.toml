[package]
name = "hypertop"
version = "0.1.2"
edition = "2021"
description = "Peek at and act on many devices at once, from one terminal"
license = "MIT"
repository = "https://github.com/0xmch/hypertop"
publish = false

[dependencies]
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
